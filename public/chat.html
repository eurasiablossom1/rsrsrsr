<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Chatbot</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0e0f11;
    --surface: #17181b;
    --surface-2: #1f2023;
    --border: #2a2b2f;
    --text: #eaeaea;
    --text-dim: #9a9ba0;
    --accent: #6d8cff;
    --accent-2: #8f6dff;
    --bubble-bot: #202126;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header-text { display: flex; flex-direction: column; line-height: 1.25; }
  .header-text .name { font-weight: 600; font-size: 14.5px; color: var(--text); letter-spacing: 0.2px; }
  .header-text .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
  .status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; display: inline-block;
    box-shadow: 0 0 6px #4ade8090;
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--surface);
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .row { display: flex; align-items: flex-end; gap: 8px; margin: 2px 0; animation: rise 0.28s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .row .avatar.small { width: 26px; height: 26px; font-size: 12px; }

  .bubble {
    max-width: 76%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.grouped-user .bubble { border-top-right-radius: 16px; }
  .row.grouped-bot .bubble { border-top-left-radius: 16px; }

  /* Typing indicator */
  .typing-bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 11px 15px;
    display: flex;
    gap: 4px;
    width: fit-content;
  }
  .typing-bubble span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input */
  #inputBar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-dim); }

  #sendBtn {
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  #sendBtn svg { fill: #fff; width: 18px; height: 18px; }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  #sendBtn:not(:disabled):active { transform: scale(0.92); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🏡</div>
    <div class="header-text">
      <div class="name">Real Estate Assistant</div>
      <div class="status">Active now</div>
    </div>
  </header>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="input" type="text" placeholder="Message..." autocomplete="off" />
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  let lastSender = null;

  function addMessage(text, who) {
    const grouped = lastSender === who;
    lastSender = who;

    const row = document.createElement("div");
    row.className = `row ${who}${grouped ? ` grouped-${who}` : ""}`;

    if (who === "bot" && !grouped) {
      const av = document.createElement("div");
      av.className = "avatar small";
      av.textContent = "🏡";
      row.appendChild(av);
    } else if (who === "bot") {
      const spacer = document.createElement("div");
      spacer.style.width = "26px";
      spacer.style.flexShrink = "0";
      row.appendChild(spacer);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    const av = document.createElement("div");
    av.className = "avatar small";
    av.textContent = "🏡";
    const bubble = document.createElement("div");
    bubble.className = "typing-bubble";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || "(no reply)", "bot");
    } catch (err) {
      hideTyping();
      addMessage("Error reaching server. Try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  addMessage("Hi! Welcome to our real estate page. I can help you find a property or schedule a viewing — what are you looking for today?", "bot");
  inputEl.focus();
</script>
</body>
</html>
