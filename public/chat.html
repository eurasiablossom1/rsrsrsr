<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e9ebee;
    margin: 0;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 1px solid #e4e6eb;
    position: sticky; top: 0; z-index: 5;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#0084ff,#00c6ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header-text { display: flex; flex-direction: column; line-height: 1.2; }
  .header-text .name { font-weight: 600; font-size: 15px; color: #050505; }
  .header-text .status { font-size: 12px; color: #65676b; display: flex; align-items: center; gap: 4px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #31a24c; display: inline-block; }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: #fff;
  }
  .row { display: flex; align-items: flex-end; gap: 6px; margin: 2px 0; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .row .avatar.small { width: 24px; height: 24px; font-size: 12px; }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: #0084ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: #f0f0f0;
    color: #050505;
    border-bottom-left-radius: 4px;
  }
  .row.grouped-user .bubble { border-top-right-radius: 18px; }
  .row.grouped-bot .bubble { border-top-left-radius: 18px; }

  /* Typing indicator */
  .typing-bubble {
    background: #f0f0f0;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 10px 14px;
    display: flex;
    gap: 4px;
    width: fit-content;
  }
  .typing-bubble span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #8a8d91;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input */
  #inputBar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-top: 1px solid #e4e6eb;
    background: #fff;
  }
  #input {
    flex: 1;
    border: none;
    background: #f0f2f5;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14.5px;
    outline: none;
  }
  #sendBtn {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn svg { fill: #0084ff; width: 22px; height: 22px; }
  #sendBtn:disabled svg { fill: #bcc0c4; }
  #sendBtn:active svg { fill: #006fd6; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🏡</div>
    <div class="header-text">
      <div class="name">Real Estate Assistant</div>
      <div class="status">Active now</div>
    </div>
  </header>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="input" type="text" placeholder="Aa" autocomplete="off" />
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  let lastSender = null;

  function addMessage(text, who) {
    const grouped = lastSender === who;
    lastSender = who;

    const row = document.createElement("div");
    row.className = `row ${who}${grouped ? ` grouped-${who}` : ""}`;

    if (who === "bot" && !grouped) {
      const av = document.createElement("div");
      av.className = "avatar small";
      av.textContent = "🏡";
      row.appendChild(av);
    } else if (who === "bot") {
      const spacer = document.createElement("div");
      spacer.style.width = "24px";
      spacer.style.flexShrink = "0";
      row.appendChild(spacer);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    const av = document.createElement("div");
    av.className = "avatar small";
    av.textContent = "🏡";
    const bubble = document.createElement("div");
    bubble.className = "typing-bubble";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || "(no reply)", "bot");
    } catch (err) {
      hideTyping();
      addMessage("Error reaching server. Try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  addMessage("Hi! Try: 'kumusta', 'condo sa Bacoor budget 3M', or 'restart'.", "bot");
  inputEl.focus();
</script>
</body>
</html>
