<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Chatbot — Test Chat</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f0f2f5; margin:0; display:flex; justify-content:center; }
  #app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:#fff; }
  header { background:#1877f2; color:#fff; padding:16px; font-weight:600; }
  #messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; line-height:1.4; font-size:14px; }
  .user { align-self:flex-end; background:#1877f2; color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#e4e6eb; color:#050505; border-bottom-left-radius:4px; }
  #inputRow { display:flex; border-top:1px solid #ddd; padding:8px; gap:8px; }
  #inputRow input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #ccc; font-size:14px; }
  #inputRow button { padding:10px 18px; border:none; border-radius:20px; background:#1877f2; color:#fff; font-weight:600; cursor:pointer; }
  #inputRow button:disabled { opacity:0.5; cursor:default; }
</style>
</head>
<body>
<div id="app">
  <header>🏡 Real Estate Chatbot (Test Chat)</header>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
</div>

<script>
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text })
      });
      const data = await res.json();
      addMessage(data.reply || "(no reply)", "bot");
    } catch (err) {
      addMessage("Error reaching server. Try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  addMessage("Hi! Try: 'kumusta', 'condo sa Bacoor budget 3M', or 'restart'.", "bot");
</script>
</body>
</html>
